    Replace family names in the URL and in --brand-font-* variables below.

    Google Sans is requested as a variable font across wght 400..700 (plus

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    /* ╔══════════════════════════════════════════════════════════════╗
       ║  BRAND CONFIGURATION — edit this section to match your brand ║
       ╚══════════════════════════════════════════════════════════════╝ */
    :root {
      /* Accent color: used for highlights, bullets, borders, CTAs.
         Pick any CSS color that reads well on a dark background.    */
      --brand-accent: #f97316;

      /* Page background: works best as a very dark color.           */
      --brand-bg: #020617;

      /* Fonts: update the Google Fonts <link> above when changing.  */
      --brand-font-main: 'Google Sans', system-ui, sans-serif;
      --brand-font-body: 'Google Sans', system-ui, sans-serif;
      --brand-font-code: 'JetBrains Mono', monospace;
    }
    /* ══════════════════════════════════════════════════════════════ */

    /* ============================================================
       DESIGN TOKENS — Tailwind CSS slate scale
       https://tailwindcss.com/docs/colors
    ============================================================ */
    :root {
      --slate-50:  #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --slate-950: #020617;
    }

    /* ============================================================
       LIGHT MODE — reverses the slate scale + page background.
       Toggled via [data-theme="light"] on <html> (see #themeToggle).
    ============================================================ */
    :root[data-theme="light"] {
      --brand-bg:  #f8fafc;
      --slate-50:  #020617;
      --slate-100: #0f172a;
      --slate-200: #1e293b;
      --slate-300: #334155;
      --slate-400: #475569;
      --slate-500: #64748b;
      --slate-600: #94a3b8;
      --slate-700: #cbd5e1;
      --slate-800: #e2e8f0;
      --slate-900: #f1f5f9;
      --slate-950: #f8fafc;
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      /* Mobile browsers resolve 100vh against the *large* viewport, so with the
         address bar showing the body is taller than what you can see and the
         centred deck sits partly under the chrome. dvh tracks the visible box. */
      height: 100dvh;
      overflow: hidden;
      background: var(--brand-bg);
      color: var(--slate-100);
      font-family: var(--brand-font-main);
      -webkit-font-smoothing: antialiased;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       BACKGROUND DECORATION
    ============================================================ */
    #bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    #bg::before {
      content: '';
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--brand-accent) 7%, transparent) 0%,
        transparent 70%
      );
      top: -280px;
      right: -220px;
    }
    #bg::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--slate-700) 30%, transparent) 0%,
        transparent 70%
      );
      bottom: -180px;
      left: -120px;
    }

    /* ============================================================
       SLIDE SYSTEM
    ============================================================ */
    #deck {
      position: relative;
      width: 1280px;
      height: 720px;      /* fixed 16:9 stage */
      flex: none;
      z-index: 1;
      transform-origin: center center;
      /* The stage is always scaled uniformly, so 1280×720 is preserved no matter
         what shape the viewport is. scaleDeck() overwrites --deck-scale below. */
      --deck-scale: 1;
      transform: scale(var(--deck-scale));
    }

    /* Ratio lock in CSS, so it holds on first paint and even with JS disabled.
       Needs length ÷ length in calc() (CSS Values 4); where that isn't supported
       the declaration is dropped and scaleDeck() is the only driver. */
    @supports (transform: scale(calc(100vh / 720px))) {
      #deck {
        --deck-scale: min(100vw / 1280px, 100dvh / 720px);
      }
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 52px 72px 96px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .slide.exit {
      opacity: 0;
      transform: translateY(-16px);
    }

    /* ============================================================
       SLIDE HEADER
    ============================================================ */
    .slide-header {
      flex-shrink: 0;
      margin-bottom: 40px;
    }

    /* Slide number — small, non-intrusive */
    .slide-num {
      display: block;
      font-family: var(--brand-font-body);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--brand-accent);
      margin-bottom: 10px;
    }

    .slide-title {
      font-size: 2.9rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--slate-50);
      text-wrap: balance;
    }

    .slide-subtitle {
      margin-top: 10px;
      font-family: var(--brand-font-body);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--slate-400);
      line-height: 1.55;
      text-wrap: pretty;
      max-width: 62ch;
    }

    /* Accent rule under header */
    .slide-header::after {
      content: '';
      display: block;
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: var(--brand-accent);
      margin-top: 20px;
    }

    /* ============================================================
       COVER SLIDE VARIANT
    ============================================================ */
    .slide--cover {
      justify-content: center;
    }

    .slide--cover .slide-header {
      margin-bottom: 0;
    }

    .slide--cover .slide-header::after {
      display: none;
    }

    .slide--cover .slide-title {
      font-size: 4.2rem;
    }

    .slide--cover .slide-subtitle {
      font-size: 1.15rem;
      max-width: 500px;
    }

    .cover-meta {
      margin-top: 44px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--brand-font-body);
      font-size: 0.85rem;
      color: var(--slate-500);
      letter-spacing: 0.04em;
    }

    .cover-meta::before {
      content: '';
      width: 36px;
      height: 2px;
      background: var(--brand-accent);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* ============================================================
       SECTION DIVIDER VARIANT
    ============================================================ */
    .slide--section {
      justify-content: center;
      align-items: flex-start;
    }

    .slide--section .slide-header::after { display: none; }

    .slide--section .section-label {
      display: inline-block;
      font-family: var(--brand-font-body);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--slate-600);
      border: 1px solid var(--slate-700);
      border-radius: 4px;
      padding: 4px 10px;
      margin-bottom: 20px;
    }

    .slide--section .slide-title {
      font-size: 3.8rem;
    }

    /* ============================================================
       SLIDE BODY
    ============================================================ */
    .slide-body {
      flex: 1;
      display: flex;
      gap: 0;
      align-items: stretch;
      min-height: 0;
    }

    /* Column */
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0 32px;
    }

    .col:first-child { padding-left: 0; }
    .col:last-child  { padding-right: 0; }

    /* Dividers between columns */
    .slide-body.cols-2 .col + .col,
    .slide-body.cols-3 .col + .col {
      border-left: 1px solid var(--slate-800);
    }

    /* Column label */
    .col-label {
      font-family: var(--brand-font-body);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brand-accent);
      margin-bottom: 20px;
    }

    .col-label.muted {
      color: var(--slate-500);
    }

    /* ============================================================
       CONTENT TYPES
    ============================================================ */

    /* --- Text --- */
    .text {
      font-family: var(--brand-font-body);
      font-size: 1.575rem;
      line-height: 1.75;
      color: var(--slate-300);
    }

    .text p + p { margin-top: 1em; }

    .text strong { display: inline; color: var(--slate-50);  font-weight: 600; }
    .text em     { display: inline; color: var(--brand-accent); font-style: normal; }

    /* --- List --- */
    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .list li {
      position: relative;
      padding-left: 20px;
      font-family: var(--brand-font-body);
      font-size: 1.42rem;
      color: var(--slate-300);
      line-height: 1.5;
      text-wrap: pretty;
    }

    .list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.65em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-accent);
    }

    .list li strong { display: inline; color: var(--slate-100); font-weight: 600; }

    /* <em> means "accent this term", not "italicise it" — same as in .text,
       so authors get one consistent rule wherever they use it. */
    .list li em,
    .callout em { display: inline; color: var(--brand-accent); font-style: normal; }

    .list li .src {
      display: inline;
      font-size: 0.78em;
      color: var(--slate-500);
      font-style: italic;
    }

    /* Numbered list variant.
       The marker is smaller than the text it labels, so its line box is
       shorter than the li's — with `line-height: inherit` the digit floated
       up like a superscript. `line-height: calc(1.5 / 0.6)` scales the
       marker's own line box back to the li's (0.6em × 1.5/0.6 = 1.5em),
       which puts the two baselines within ~1px. Both numbers are expressed
       relative to `.list li` above: change its line-height and this must
       track it. Sizes stay in `em` so a per-slide font-size override on the
       list keeps the marker in proportion.
       Digits are right-aligned in a fixed box with tabular figures so the
       gap before the text is identical for 1 and for 11. */
    .list.numbered { counter-reset: item; padding-left: 0; }
    .list.numbered li { padding-left: 26px; }
    .list.numbered li::before {
      content: counter(item);
      counter-increment: item;
      background: none;
      width: 16px;
      height: auto;
      top: 0;
      text-align: right;
      line-height: calc(1.5 / 0.6);
      border-radius: 0;
      font-family: var(--brand-font-body);
      font-size: 0.6em;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--brand-accent);
    }

    /* --- Callout --- */
    .callout {
      background: color-mix(in srgb, var(--brand-accent) 8%, transparent);
      border-left: 3px solid var(--brand-accent);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      font-family: var(--brand-font-body);
      font-size: 1.5rem;
      color: var(--slate-200);
      line-height: 1.65;
    }
    .callout.compact {
      padding: 12px 18px;
      font-size: 1.15rem;
      line-height: 1.5;
      margin-top: 28px;
    }

    /* --- Code block --- */
    /* Inline code — the only other place the mono family is used.
       Everything else in the deck is Google Sans. */
    code {
      font-family: var(--brand-font-code);
      font-size: 0.92em;
    }

    .code-block {
      background: var(--slate-900);
      border: 1px solid var(--slate-700);
      border-radius: 12px;
      padding: 22px 26px;
      font-family: var(--brand-font-code);
      font-size: 1.12rem;
      line-height: 1.9;
      color: var(--slate-200);
      overflow: hidden;
      flex: 1;
    }

    .code-block .code-line {
      white-space: pre;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-block .code-line.blank { height: 0.6em; }

    .code-lang {
      font-family: var(--brand-font-body);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand-accent);
      margin-bottom: 12px;
    }

    .code-block .kw  { color: var(--brand-accent); }
    .code-block .str { color: var(--slate-300); }
    .code-block .cmt { color: var(--slate-600); }
    .code-block .fn  { color: var(--slate-100); }

    /* --- Comparison table --- */
    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--brand-font-body);
      table-layout: fixed;
    }
    .cmp-table th,
    .cmp-table td {
      text-align: left;
      padding: 7px 14px;
      vertical-align: top;
      border-bottom: 1px solid var(--slate-800);
      line-height: 1.3;
    }
    .cmp-table thead th {
      font-family: var(--brand-font-main);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      border-bottom: 2px solid var(--slate-700);
      padding-bottom: 8px;
    }
    .cmp-table thead th:nth-child(2) { color: var(--brand-accent); }
    .cmp-table thead th:nth-child(3) { color: var(--slate-400); }
    .cmp-table tbody tr:last-child td { border-bottom: none; }
    .cmp-table .cmp-crit {
      font-family: var(--brand-font-main);
      font-weight: 600;
      color: var(--slate-300);
      font-size: 1rem;
      width: 20%;
      white-space: nowrap;
    }
    .cmp-table td {
      font-size: 1.05rem;
      color: var(--slate-200);
    }
    .cmp-table td:nth-child(3) { color: var(--slate-400); }
    .cmp-table col.c-crit { width: 26%; }
    .cmp-table col.c-cell { width: 37%; }

    /* --- Stat --- */
    .stat-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 8px;
    }

    .stat-number {
      font-size: 4.2rem;
      font-weight: 700;
      color: var(--brand-accent);
      line-height: 1;
      letter-spacing: -0.02em;
      max-width: 100%;
      white-space: nowrap;
    }

    .stat-label {
      font-family: var(--brand-font-body);
      font-size: 1.35rem;
      color: var(--slate-400);
      letter-spacing: 0.06em;
    }

    /* --- Tag group --- */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .tag {
      font-family: var(--brand-font-body);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--slate-700);
      color: var(--slate-300);
      background: color-mix(in srgb, var(--slate-700) 30%, transparent);
    }

    .tag.accent {
      border-color: var(--brand-accent);
      color: var(--brand-accent);
      background: color-mix(in srgb, var(--brand-accent) 10%, transparent);
    }

    /* --- Tag block: stacked chính/phụ variant --- */
    .tag-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--slate-700);
      background: color-mix(in srgb, var(--slate-700) 30%, transparent);
    }

    .tag-main {
      font-family: var(--brand-font-main);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--slate-50);
      white-space: nowrap;
    }

    .tag-sub {
      font-family: var(--brand-font-body);
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--slate-400);
      white-space: nowrap;
    }

    .tag-block.accent {
      border-color: var(--brand-accent);
      background: color-mix(in srgb, var(--brand-accent) 10%, transparent);
    }

    .tag-block.accent .tag-main {
      color: var(--brand-accent);
    }

    /* --- Diagram (soft, flat style) ---
       Tokens for inline-SVG diagrams: rounded cards, pastel tinted fills,
       neutral rounded connectors. Inline SVG keeps a deck self-contained
       (no image files) and theme-aware.

       Hue fills are deliberately *translucent* rather than per-theme solids:
       a 16% wash reads as a muted tint over the dark page and as a pastel
       over the light one, so one value works in both modes.

       FLAT BY DESIGN — no shadows, and never `filter:`/feDropShadow:
         · a filtered region forces Chrome's print-to-PDF to rasterise that
           area into a bitmap, so the slide stops being pure vector
         · a blurred shadow is invisible on a dark background anyway
         · a faked offset-rect shadow peeks out under the card's own border
           in light mode and reads as a misaligned fill
    */
    .diagram {
      width: 100%;
      height: auto;
      max-height: 100%;
    }

    /* This token set is shared verbatim with the `soft-visuals` skill, so an
       <svg> generated there can be pasted into a slide with no edits. Keep the
       two in sync — a missing token silently renders as no fill. */
    :root {
      --dg-text:    var(--slate-100);
      --dg-muted:   var(--slate-400);
      --dg-line:    var(--slate-500);
      --dg-border:  var(--slate-700);
      --dg-surface: color-mix(in srgb, var(--slate-800) 55%, transparent);

      --dg-blue:        #60a5fa;
      --dg-blue-fill:   color-mix(in srgb, #60a5fa 16%, transparent);
      --dg-violet:      #a78bfa;
      --dg-violet-fill: color-mix(in srgb, #a78bfa 16%, transparent);
      --dg-mint:        #34d399;
      --dg-mint-fill:   color-mix(in srgb, #34d399 16%, transparent);
      --dg-amber:       #fbbf24;
      --dg-amber-fill:  color-mix(in srgb, #fbbf24 16%, transparent);
      --dg-rose:        #fb7185;
      --dg-rose-fill:   color-mix(in srgb, #fb7185 16%, transparent);
      --dg-cyan:        #22d3ee;
      --dg-cyan-fill:   color-mix(in srgb, #22d3ee 16%, transparent);
      --dg-accent-fill: color-mix(in srgb, var(--brand-accent) 16%, transparent);
    }

    /* --- Spacer --- */
    .spacer { flex: 1; }

    /* ============================================================
       WATERMARK — BigIn logo, bottom left
    ============================================================ */
    #watermark {
      position: fixed;
      bottom: 20px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
    }

    #watermark svg,
    #watermark img {
      height: 80px;
      width: auto;
      opacity: 0.35;
    }

    /* ============================================================
       NAVIGATOR — bottom right, horizontal, 48px tall
    ============================================================ */
    #navigator {
      position: fixed;
      bottom: 20px;
      right: 40px;
      z-index: 10;
      height: 48px;
      width: auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      opacity: 0.5;
      transition: opacity 0.25s ease;
    }

    #navigator:hover { opacity: 1; }

    .nav-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: var(--slate-300);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--slate-800);
      color: var(--brand-accent);
    }

    .nav-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
    }

    .nav-label {
      font-family: var(--brand-font-body);
      font-size: 12px;
      color: var(--slate-500);
      text-align: center;
      user-select: none;
      white-space: nowrap;
    }

    .nav-label .cur {
      color: var(--slate-100);
      font-weight: 600;
    }

    /* ============================================================
       THEME TOGGLE — dark/light mode switch, top right
    ============================================================ */
    #themeToggle {
      position: fixed;
      top: 24px;
      right: 40px;
      z-index: 10;
      width: 38px;
      height: 38px;
      background: transparent;
      border: 1px solid var(--slate-700);
      border-radius: 8px;
      cursor: pointer;
      color: var(--slate-300);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    #themeToggle:hover {
      background: var(--slate-800);
      color: var(--brand-accent);
      border-color: var(--brand-accent);
    }

    #themeToggle svg {
      width: 18px;
      height: 18px;
    }

    #themeToggle .icon-moon { display: none; }
    :root[data-theme="light"] #themeToggle .icon-sun  { display: none; }
    :root[data-theme="light"] #themeToggle .icon-moon { display: flex; }

    /* ============================================================
       FULLSCREEN TOGGLE — next to theme toggle, top right
    ============================================================ */
    #fullscreenToggle {
      position: fixed;
      top: 24px;
      right: 88px;
      z-index: 10;
      width: 38px;
      height: 38px;
      background: transparent;
      border: 1px solid var(--slate-700);
      border-radius: 8px;
      cursor: pointer;
      color: var(--slate-300);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    #fullscreenToggle:hover {
      background: var(--slate-800);
      color: var(--brand-accent);
      border-color: var(--brand-accent);
    }

    #fullscreenToggle svg {
      width: 18px;
      height: 18px;
    }

    #fullscreenToggle .icon-compress { display: none; }
    #fullscreenToggle.is-fullscreen .icon-expand   { display: none; }
    #fullscreenToggle.is-fullscreen .icon-compress { display: flex; }

    /* ============================================================
       PRINT / PDF EXPORT — one slide per page, 16:9 landscape.
       Only applies when printing or exporting to PDF; the on-screen
       deck (with JS-driven slide switching) is unaffected.
    ============================================================ */
    @media print {
      @page { size: 1280px 720px; margin: 0; }

      html, body {
        width: auto;
        height: auto;
        overflow: visible;
        display: block;
        background: var(--brand-bg);
      }

      #deck {
        position: static;
        width: 1280px;
        height: auto;
        transform: none !important;
      }

      .slide {
        position: relative;
        inset: auto;
        opacity: 1 !important;
        pointer-events: auto;
        transform: none !important;
        transition: none !important;
        width: 1280px;
        height: 720px;
        box-sizing: border-box;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
      }

      .slide:last-child {
        page-break-after: auto;
        break-after: auto;
      }

      #navigator, #themeToggle, #fullscreenToggle {
        display: none !important;
      }

      /* Percentage max-width/max-height on images inside flex columns
         don't resolve in some print engines — force fixed px sizing. */
      .slide-body img {
        max-width: 540px !important;
        max-height: 520px !important;
        width: auto !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>

<!-- Ambient background -->
<div id="bg" aria-hidden="true"></div>

<!-- ================================================================
     SLIDE DECK
================================================================ -->
<div id="deck">

  <!-- ═══════════════════════════════════════════════════════════
       SLIDES GO HERE — replace this comment block with <section>
       elements following the patterns in SKILL.md.

       First slide must have: class="slide slide--cover active"
       All others:           class="slide"
       Section dividers:     class="slide slide--section"
  ══════════════════════════════════════════════════════════════ -->

</div><!-- /#deck -->

<!-- ================================================================
     LOGO / WATERMARK
     Replace the <svg> below with your own logo.

     Options:
       • Inline SVG:  paste your SVG markup directly
       • Image file:  <img src="your-logo.png" alt="Your Brand">
       • Remote URL:  <img src="https://example.com/logo.svg" alt="Your Brand">

     Keep height around 80px. Opacity is set in #watermark svg / #watermark img above.
     To remove the watermark entirely, delete this whole block.

<nav id="navigator" aria-label="Slide navigation">
  <!-- Prev (chevron left) -->
  <button class="nav-btn" id="prevBtn" aria-label="Previous slide" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>

  <div class="nav-label">
    <span class="cur" id="curPage">1</span>
    <span style="color:var(--slate-700)"> / </span>

  </div>
  <!-- Next (chevron right) -->
  <button class="nav-btn" id="nextBtn" aria-label="Next slide">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 6 15 12 9 18"/>
    </svg>
  </button>

<!-- ================================================================
     NAVIGATION SCRIPT
================================================================ -->
<script>
  /* ============================================================
     THEME TOGGLE — dark/light, remembers choice in localStorage
  ============================================================ */
  (function () {
    const root  = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const stored = localStorage.getItem('workshop-deck-theme');
    const initial = stored || 'dark';
    root.setAttribute('data-theme', initial);

    function toggleTheme() {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('workshop-deck-theme', next);
    }

    toggle.addEventListener('click', toggleTheme);

    // Keyboard shortcut: "T" toggles dark/light mode
    document.addEventListener('keydown', e => {
      if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        toggleTheme();
      }
    });
  })();

  /* ============================================================
     FULLSCREEN TOGGLE — button + "F" keyboard shortcut
  ============================================================ */
  (function () {
    const btn = document.getElementById('fullscreenToggle');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener('fullscreenchange', () => {
      btn.classList.toggle('is-fullscreen', !!document.fullscreenElement);
    });

    btn.addEventListener('click', toggleFullscreen);

    // Keyboard shortcut: "F" toggles fullscreen
    document.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });
  })();

  const slides  = Array.from(document.querySelectorAll('.slide'));
  const total   = slides.length;
  let   current = 0;

  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const curPage  = document.getElementById('curPage');
  const totPage  = document.getElementById('totPage');

  totPage.textContent = total;

  function goTo(index) {
    if (index < 0 || index >= total) return;
    const outgoing = slides[current];
    outgoing.classList.add('exit');
    outgoing.classList.remove('active');
    // Clean up exit class after transition ends
    outgoing.addEventListener('transitionend', () => outgoing.classList.remove('exit'), { once: true });
    current = index;
    slides[current].classList.add('active');
    curPage.textContent  = current + 1;
    prevBtn.disabled     = current === 0;
    nextBtn.disabled     = current === total - 1;
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
      e.preventDefault(); goTo(current + 1);
    }
    if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
      e.preventDefault(); goTo(current - 1);
    }
  });

  // Init state — first slide already has .active in HTML, just sync controls
  curPage.textContent = 1;
  totPage.textContent = total;
  prevBtn.disabled    = true;
  nextBtn.disabled    = total <= 1;

  /* ============================================================
     16:9 SCALING — keep the 1280×720 stage's aspect ratio intact
     and scale the whole deck down to fit any screen (incl. phones).
  ============================================================ */
  const deck = document.getElementById('deck');
  const BASE_W = 1280;
  const BASE_H = 720;

  function scaleDeck() {
    // documentElement.clientWidth/Height, not window.innerWidth/Height: this is
    // the CSS layout box the deck is actually centred in — scrollbars excluded,
    // and on mobile it tracks the visible viewport rather than the large one.
    const root = document.documentElement;
    const scale = Math.min(
      root.clientWidth  / BASE_W,
      root.clientHeight / BASE_H
    );
    // A zero or NaN viewport — a display:none container, a hidden iframe, a
    // snapshot renderer, or a call before first layout — would otherwise scale
    // the deck to nothing and render a blank page. Hold at 1:1; the observer
    // below re-runs this the moment the container gets a real size.
    deck.style.setProperty('--deck-scale', scale > 0 ? scale : 1);
  }

  scaleDeck();
  window.addEventListener('resize', scaleDeck);
  window.addEventListener('orientationchange', scaleDeck);

  // A `resize` event only fires for the *window*. A deck that loads inside a
  // container which is zero-sized or display:none at load — a lazily-revealed
  // pane, a background tab, an iframe embed — measures 0, falls back to 1:1 and
  // never hears about the reveal, so it renders at a hard 1280×720 and gets
  // cropped by the container instead of fitting it. Observing the root element
  // catches that, plus any container resize the window never sees.
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scaleDeck).observe(document.documentElement);
  }

  // Pinch-zoom and mobile toolbar show/hide change the visible viewport without
  // always firing a window resize.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scaleDeck);
  }

  /* ============================================================
     SWIPE NAVIGATION — for phones/tablets without a keyboard
  ============================================================ */
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    // horizontal swipe only, ignore small/vertical gestures
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      goTo(dx < 0 ? current + 1 : current - 1);
    }
  }, { passive: true });
</script>
