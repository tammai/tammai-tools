StylesPath = styles
MinAlertLevel = warning

# Optional: run `vale sync` to add packaged guides, then append
# them to BasedOnStyles (e.g. write-good, Google).
# Packages = write-good

[*.md]
# Both styles run on every file. Rules are language-disjoint:
# Vietnamese patterns never match English prose and vice versa,
# so no path-based scoping is needed. TamMai's English banned
# words intentionally still fire inside Vietnamese docs, since
# Vietnamese tech writing mixes in English slop words too.
BasedOnStyles = TamMai, TamMaiVI

# Code blocks and inline code are ignored by default scoping below.
BlockIgnores = (?s)```.*?```
TokenIgnores = `[^`]+`
