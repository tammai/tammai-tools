StylesPath = styles
MinAlertLevel = warning

# Optional: run `vale sync` to add packaged guides, then append
# them to BasedOnStyles (e.g. write-good, Google).
# Packages = write-good

[*.md]
# Both styles run on every file. Rules are language-disjoint:
# Vietnamese patterns never match English prose and vice versa,
# so no path-based scoping is needed. TamMai's English banned
# words intentionally still fire inside Vietnamese docs, since
# Vietnamese tech writing mixes in English slop words too.
BasedOnStyles = TamMai, TamMaiVI

# Do NOT add BlockIgnores/TokenIgnores for code. Vale's default
# markdown scoping already skips fenced blocks and inline code
# (verified), so both are redundant — and the TokenIgnores form is
# actively dangerous: a backtick-delimited pattern loses its outer
# backticks to the INI parser and degrades into one that matches
# every run of non-backtick characters, i.e. the whole document.
# Every rule then reports zero, and a broken config looks exactly
# like a clean file. Run selftest.py after touching anything here.
